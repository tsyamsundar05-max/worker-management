<!DOCTYPE html>
<html>
<head>
<title>Edit Worker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<h2>Edit Worker</h2>

<form method="POST">

<input type="text"
name="worker_id"
value="{{ worker[1] }}"
class="form-control mb-3"
placeholder="Worker ID">

<input type="text"
name="name"
value="{{ worker[2] }}"
class="form-control mb-3"
placeholder="Worker Name">

<input type="number"
name="age"
value="{{ worker[3] }}"
class="form-control mb-3"
placeholder="Age">

<select name="department" class="form-control mb-3">

    <option value="HR" {% if worker[4]=='HR' %}selected{% endif %}>HR</option>

    <option value="IT" {% if worker[4]=='IT' %}selected{% endif %}>IT</option>

    <option value="Finance" {% if worker[4]=='Finance' %}selected{% endif %}>Finance</option>

    <option value="Marketing" {% if worker[4]=='Marketing' %}selected{% endif %}>Marketing</option>

    <option value="Operations" {% if worker[4]=='Operations' %}selected{% endif %}>Operations</option>

</select>

<select name="status" class="form-control mb-3">

    <option value="Active" {% if worker[6]=='Active' %}selected{% endif %}>Active</option>

    <option value="On Leave" {% if worker[6]=='On Leave' %}selected{% endif %}>On Leave</option>

    <option value="Inactive" {% if worker[6]=='Inactive' %}selected{% endif %}>Inactive</option>

</select>

<input type="number"
name="salary"
value="{{ worker[5] }}"
class="form-control mb-3"
placeholder="Salary">

<button class="btn btn-primary">
Update Worker
</button>

</form>
